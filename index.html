<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HABAO88｜AI・工具・網站・更多應用</title>
  <meta name="description" content="HABAO88 整合 AI、實用工具、網站與更多數位應用，持續探索更多可能。">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", Arial, sans-serif;
      background:
        radial-gradient(circle at 52% 0%, rgba(25,119,255,.14), transparent 34%),
        #071018;
      color: #fff;
      line-height: 1.6;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1120px, calc(100% - 40px));
      margin: auto;
    }


    /* =========================
       Header
    ========================= */

    header {
      height: 70px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(6,12,19,.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ffd237;
    }

    .nav-right {
      font-size: 14px;
      color: #9da9b8;
    }


    /* =========================
       Hero
    ========================= */

    .hero {
      min-height: 540px;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 35px 0 20px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 10px;
    }

    .hero-copy {
      position: relative;
      z-index: 3;
    }

    .eyebrow {
      color: #ffd237;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-size: clamp(58px, 8vw, 92px);
      line-height: .95;
      font-weight: 950;
      letter-spacing: -5px;
    }

    .hero h1 span {
      color: #ffd237;
    }

    .hero h2 {
      font-size: clamp(24px, 3.5vw, 38px);
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #99a7b7;
      font-size: 17px;
      max-width: 560px;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      background: #ffd237;
      color: #0b0e12;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(255,210,55,.18);
      transition: .2s ease;
    }

    .hero-btn:hover {
      transform: translateY(-2px);
    }

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      min-height: 470px;
      margin-left: -20px;
    }

    .hero-glow {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: #0a74ff;
      opacity: .14;
      filter: blur(95px);
      top: 25px;
      left: 20px;
    }

    .hero-character {
      position: relative;
      z-index: 2;
      width: min(525px, 110%);
      max-height: 520px;
      object-fit: contain;
      object-position: bottom center;
      transform: translate(-10px, -25px);
    }


    /* =========================
       Sections
    ========================= */

    .section {
      padding: 58px 0;
    }

    #services {
      padding-top: 35px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 30px;
      font-weight: 900;
    }

    .section-note {
      color: #7f8c9d;
      font-size: 14px;
    }


    /* =========================
       Service card
    ========================= */

    .service-card {
      border: 1px solid #263547;
      background:
        linear-gradient(
          135deg,
          rgba(13,29,46,.98),
          rgba(6,14,23,.98)
        );

      border-radius: 28px;

      display: grid;
      grid-template-columns: 1fr 390px;

      overflow: hidden;
      min-height: 430px;
      position: relative;
    }

    .service-card::before {
      content: "";
      position: absolute;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      background: #00da8a;
      opacity: .09;

      filter: blur(85px);

      right: 90px;
      top: 50px;
    }

    .service-copy {
      padding: 50px 58px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      position: relative;
      z-index: 2;
    }

    .service-label {
      color: #48eca3;

      font-size: 13px;
      font-weight: 900;

      letter-spacing: 2px;

      margin-bottom: 10px;
    }

    .service-copy h3 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .service-copy p {
      color: #9dacbb;
      font-size: 17px;
      margin-bottom: 24px;
    }


    /* tags */

    .tags {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 26px;
    }

    .tag {
      padding: 7px 11px;

      border-radius: 999px;

      background: rgba(71,238,165,.08);
      border: 1px solid rgba(71,238,165,.2);

      color: #72efb7;

      font-size: 12px;
      font-weight: 700;
    }


    /* button */

    .use-btn {
      display: inline-flex;

      width: fit-content;

      align-items: center;
      gap: 9px;

      padding: 13px 24px;

      border-radius: 999px;

      background: #43eda2;

      color: #06110c;

      font-weight: 900;

      transition: .2s;
    }

    .use-btn:hover {
      transform: translateY(-2px);
    }


    /* App image */

    .app-area {
      display: flex;
      justify-content: center;
      align-items: flex-end;

      padding: 28px 28px 0;

      position: relative;
      z-index: 2;
    }

    .app-shot {
      width: 285px;

      border-radius: 30px 30px 0 0;

      box-shadow:
        0 0 70px rgba(0,0,0,.55),
        0 0 40px rgba(50,230,160,.06);

      border: 1px solid rgba(255,255,255,.1);
    }


    /* =========================
       Future services
    ========================= */

    .future-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .future-card {
      border: 1px solid #1d2b3b;
      background: #0d1621;

      border-radius: 20px;

      padding: 28px 18px;

      text-align: center;

      transition: .2s;
    }

    .future-card:hover {
      transform: translateY(-3px);
      border-color: #32455b;
    }

    .future-icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .future-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 16px;
    }

    .future-card small {
      color: #647287;
    }


    /* =========================
       Footer
    ========================= */

    footer {
      border-top: 1px solid rgba(255,255,255,.07);

      padding: 48px 20px;

      text-align: center;

      color: #667487;
    }

    .footer-logo {
      color: #fff;

      font-size: 24px;
      font-weight: 900;

      margin-bottom: 6px;
    }

    .footer-logo span {
      color: #ffd237;
    }


    /* =========================
       Tablet
    ========================= */

    @media (max-width: 820px) {

      .hero {
        min-height: auto;
        padding: 55px 0 15px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero p {
        margin: auto;
      }

      .hero h1 {
        letter-spacing: -3px;
      }

      .hero-visual {
        justify-content: center;
        min-height: 370px;
        margin-left: 0;
        margin-top: 0;
      }

      .hero-character {
        width: 390px;
        transform: none;
      }

      #services {
        padding-top: 20px;
      }

      .service-card {
        grid-template-columns: 1fr;
      }

      .service-copy {
        padding: 36px 28px;

        text-align: center;

        align-items: center;
      }

      .app-area {
        padding-top: 0;
      }

      .app-shot {
        width: 250px;
      }

      .future-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }


    /* =========================
       Mobile
    ========================= */

    @media (max-width: 520px) {

      .wrap {
        width: min(100% - 28px, 1120px);
      }

      header {
        height: 62px;
      }

      .logo {
        font-size: 22px;
      }

      .nav-right {
        font-size: 12px;
      }

      .hero {
        padding-top: 44px;
      }

      .hero h1 {
        font-size: 54px;
      }

      .hero h2 {
        font-size: 25px;
      }

      .hero p {
        font-size: 15px;
      }

      .hero-btn {
        margin-top: 24px;
      }

      .hero-visual {
        min-height: 315px;
      }

      .hero-character {
  width: 330px;
  transform: translateY(-25px);
}
      .section {
        padding: 50px 0;
      }

      #services {
        padding-top: 10px;
      }

      .section-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .section-title {
        font-size: 25px;
      }

.service-card {
  min-height: auto;
  padding-bottom: 0;
}

.service-copy {
  padding: 24px 20px 18px;
}

      .service-copy h3 {
        font-size: 30px;
      }

      .service-copy p {
        font-size: 15px;
      }

      .app-area {
  padding: 0 14px 0;
}
      
      .app-shot {
width: 170px;
}

      .future-grid {
        gap: 10px;
      }

      .future-card {
        padding: 22px 12px;
      }
    }

  </style>
</head>

    <div style="
